services:
  # 1. База данных PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: translator_pass
      POSTGRES_DB: translator_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator -d translator_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Сервис перевода 
  web-service:
    build: ./web-service

  # 3. Backend API
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://translator:translator_pass@db:5432/translator_db
      TRANSLATE_URL: http://web-service:5000/translate
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started
    ports:
      - "3000:3000"

  # 4. Frontend
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: