<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн переводчик — Вариант 18</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-2: #273449;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 0%, #1e293b 0%, var(--bg) 55%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 760px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #818cf8, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--muted);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 14px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .langs {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
        }

        select {
            flex: 1;
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            padding: 10px 12px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Кнопка смены языков */
        .swap-btn {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-2);
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, background 0.2s, border-color 0.2s;
        }

        .swap-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .swap-btn.spin {
            transform: rotate(180deg);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        button {
            flex: 1;
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, opacity 0.2s;
            font-family: inherit;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #fff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--accent-hover), #4338ca);
        }

        .btn-secondary {
            background: var(--card-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #334155;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Блок результата — кликабельный */
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: var(--card-2);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            min-height: 58px;
            display: none;
            position: relative;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .result-box.visible {
            display: block;
        }

        .result-box:hover {
            background: #2f3f57;
        }

        .result-box.copied {
            border-left-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .result-box h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-hint {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: none;
            letter-spacing: 0;
            font-weight: 400;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .result-box:hover .copy-hint {
            opacity: 1;
        }

        .copy-hint.done {
            color: var(--success);
            opacity: 1;
        }

        .result-text {
            font-size: 1.15rem;
            color: var(--success);
            word-break: break-word;
        }

        .result-text.error {
            color: var(--error);
        }

        /* Всплывающее уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--success);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .history {
            margin-top: 28px;
            display: none;
        }

        .history.visible {
            display: block;
        }

        .history h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            font-size: 0.9rem;
        }

        th {
            background: var(--card-2);
            color: var(--muted);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            padding: 10px 12px;
            text-align: left;
        }

        td {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            word-break: break-word;
        }

        tbody tr:hover {
            background: var(--card-2);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 20px;
            font-style: italic;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 520px) {
            .buttons {
                flex-direction: column;
            }

            .langs {
                flex-wrap: wrap;
            }

            select {
                flex: 1 1 100%;
            }

            .swap-btn {
                order: 3;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Онлайн переводчик</h1>
            <p>Вариант 18 · Березин Д.Н.</p>
        </header>

        <div class="card">
            <label for="inputText">Текст для перевода</label>
            <textarea id="inputText" placeholder="Введите текст..."></textarea>

            <div class="langs">
                <select id="sourceLang" aria-label="Исходный язык">
                    <option value="en">English</option>
                    <option value="ru" selected>Русский</option>
                    <option value="zh">中文</option>
                </select>

                <!-- НОВОЕ: кнопка смены языков -->
                <button id="btnSwap" class="swap-btn" title="Поменять языки местами"
                    aria-label="Поменять языки местами">⇄</button>

                <select id="targetLang" aria-label="Целевой язык">
                    <option value="en" selected>English</option>
                    <option value="ru">Русский</option>
                    <option value="zh">中文</option>
                </select>
            </div>

            <div class="buttons">
                <button id="btnTranslate" class="btn-primary">Перевести</button>
                <button id="btnHistory" class="btn-secondary">Показать историю</button>
            </div>

            <div id="resultBox" class="result-box" title="Нажмите, чтобы скопировать">
                <h3>
                    <span>Результат перевода</span>
                    <span id="copyHint" class="copy-hint">клик — копировать</span>
                </h3>
                <div id="resultText" class="result-text"></div>
            </div>
        </div>

        <div id="history" class="history">
            <h2>История переводов</h2>
            <div id="historyContent"></div>
        </div>
    </div>

    <div id="toast" class="toast">Скопировано!</div>

    <script>
        const API = 'http://localhost:3000/api';

        const btnTranslate = document.getElementById('btnTranslate');
        const btnHistory = document.getElementById('btnHistory');
        const btnSwap = document.getElementById('btnSwap');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const copyHint = document.getElementById('copyHint');
        const historyBlock = document.getElementById('history');
        const historyContent = document.getElementById('historyContent');
        const toast = document.getElementById('toast');
        const inputText = document.getElementById('inputText');
        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');

        let lastResult = '';

        function showResult(text, isError = false) {
            resultBox.classList.add('visible');
            resultText.textContent = text;
            resultText.classList.toggle('error', isError);
            lastResult = isError ? '' : text;
            copyHint.classList.remove('done');
            copyHint.textContent = 'клик — копировать';
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        // ===== Перевод =====
        async function doTranslate() {
            const text = inputText.value.trim();
            const source = sourceLang.value;
            const target = targetLang.value;

            if (!text) { showResult('Введите текст для перевода', true); return; }
            if (source === target) { showResult('Исходный и целевой языки совпадают', true); return; }

            btnTranslate.disabled = true;
            btnTranslate.innerHTML = '<span class="spinner"></span>Перевод...';

            try {
                const res = await fetch(`${API}/translate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, source, target })
                });
                const data = await res.json();
                if (data.translatedText) showResult(data.translatedText);
                else showResult(data.error || 'Не удалось перевести', true);
            } catch (e) {
                showResult('Ошибка соединения с сервером', true);
            } finally {
                btnTranslate.disabled = false;
                btnTranslate.textContent = 'Перевести';
            }
        }

        // ===== Смена языков =====
        btnSwap.onclick = () => {
            const s = sourceLang.value;
            const t = targetLang.value;
            sourceLang.value = t;
            targetLang.value = s;

            // Анимация поворота
            btnSwap.classList.add('spin');
            setTimeout(() => btnSwap.classList.remove('spin'), 300);

            // Если есть результат — переносим его в поле ввода (цепочка переводов)
            if (lastResult) {
                inputText.value = lastResult;
                resultBox.classList.remove('visible');
                lastResult = '';
                showToast('Языки поменяны, перевод перенесён в поле ввода');
            }
        };

        // ===== Копирование результата =====
        async function copyResult() {
            if (!lastResult) return;
            try {
                await navigator.clipboard.writeText(lastResult);
            } catch (e) {
                // Fallback для старых браузеров / http
                const ta = document.createElement('textarea');
                ta.value = lastResult;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            copyHint.textContent = '✓ Скопировано';
            copyHint.classList.add('done');
            resultBox.classList.add('copied');
            showToast('Скопировано!');
            setTimeout(() => {
                resultBox.classList.remove('copied');
                copyHint.classList.remove('done');
                copyHint.textContent = 'клик — копировать';
            }, 1500);
        }

        resultBox.onclick = copyResult;

        // ===== История =====
        async function loadHistory() {
            historyBlock.classList.add('visible');
            historyContent.innerHTML = '<div class="empty">Загрузка...</div>';
            try {
                const res = await fetch(`${API}/history`);
                const rows = await res.json();
                if (!rows.length) {
                    historyContent.innerHTML = '<div class="empty">История пуста</div>';
                    return;
                }
                let html = '<table><thead><tr><th>Исходный текст</th><th>Перевод</th><th>Языки</th><th>Время</th></tr></thead><tbody>';
                rows.forEach(r => {
                    const time = new Date(r.created_at).toLocaleString('ru-RU');
                    html += `<tr>
            <td>${escapeHtml(r.source_text)}</td>
            <td>${escapeHtml(r.translated_text)}</td>
            <td>${r.source_lang} → ${r.target_lang}</td>
            <td>${time}</td>
          </tr>`;
                });
                html += '</tbody></table>';
                historyContent.innerHTML = html;
            } catch (e) {
                historyContent.innerHTML = '<div class="empty">Ошибка загрузки истории</div>';
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        btnTranslate.onclick = doTranslate;
        btnHistory.onclick = loadHistory;

        // Ctrl+Enter — быстрый перевод
        inputText.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doTranslate();
        });
    </script>
</body>

</html>
